<title>Quaderno di ricette</title>
<style>
:root{--paper:#FDFDFB;--grid:#D9E4F4;--ink:#1C2A4A;--soft:#55627F;--line:#C3CDDF;--accent:#2447B3;--on:#fff;--done:#2F8F5B;--todo:#E0B100;--field:#fff;--card:#fff;--glass:rgba(255,255,255,.4);--glass-hi:rgba(255,255,255,.7);--glass-b:rgba(255,255,255,.8);--glass-s:rgba(28,42,74,.22);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#151D2E;--grid:#202D47;--ink:#E8ECF5;--soft:#9AA7C2;--line:#2C3A57;--accent:#7C9BFF;--on:#0F1624;--done:#4CC38A;--todo:#F2C94C;--field:#0F1624;--card:#1B2538;--glass:rgba(44,58,87,.45);--glass-hi:rgba(255,255,255,.16);--glass-b:rgba(255,255,255,.2);--glass-s:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#151D2E;--grid:#202D47;--ink:#E8ECF5;--soft:#9AA7C2;--line:#2C3A57;--accent:#7C9BFF;--on:#0F1624;--done:#4CC38A;--todo:#F2C94C;--field:#0F1624;--card:#1B2538;--glass:rgba(44,58,87,.45);--glass-hi:rgba(255,255,255,.16);--glass-b:rgba(255,255,255,.2);--glass-s:rgba(0,0,0,.55);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
.grid{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 24px 110px}
.cover h1{font:700 clamp(46px,13vw,76px)/1 Caveat,cursive;margin:0 0 10px}
.cover p{margin:0;color:var(--soft)}
.cover .big{margin-top:26px;padding:15px 40px;font-size:18px;border-radius:99px}
.cover .small{margin-top:14px;font-size:14px}
.view{scrollbar-width:none;position:fixed;inset:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(40px + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.view.on{visibility:visible;transform:none;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.view::-webkit-scrollbar{display:none}
#v-list{z-index:10;transform:translateY(100%)}
#v-recipe{z-index:11;transform:translateX(100%)}
#v-form{z-index:12;transform:translateX(100%)}
#v-shop{z-index:11;transform:translateX(100%)}
#v-list.on,#v-recipe.on,#v-form.on,#v-shop.on{transform:none}
.sheet{max-width:640px;margin:0 auto}
.fbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fbar .back{margin:0}
.fbar .b{padding:11px 20px;border-radius:99px;font-size:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.head h2{font:700 clamp(40px,11vw,56px)/1 Caveat,cursive;margin:0}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--glass-b),0 8px 24px var(--glass-s);color:var(--ink)}
.plus{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;font:inherit}
.back{border-radius:99px;padding:8px 14px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;margin-bottom:10px}
.row{display:block;width:100%;text-align:left;border:0;border-left:8px solid var(--accent);border-radius:4px 14px 14px 4px;background:var(--card);color:var(--ink);padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 0 var(--line);font-family:inherit}
.row.fatta{border-left-color:var(--done)}
.rt{display:block;font:700 26px/1.1 Caveat,cursive;overflow-wrap:anywhere}
.rs{display:block;font-size:14px;color:var(--soft)}
#search{margin-bottom:8px}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chipb{border:1.5px solid var(--line);background:var(--field);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 15px/1 "Source Sans 3",system-ui,sans-serif;cursor:pointer}
.chipb.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.serv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 2px;font-size:18px}
.gh{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);font:700 28px/1.2 Caveat,cursive;padding:10px 2px 4px;margin:14px 0 10px;cursor:pointer;text-align:left}
.gc{font:600 14px "Source Sans 3",system-ui,sans-serif;color:var(--soft)}
.gv{font:600 26px/1 "Source Sans 3",system-ui,sans-serif;color:var(--soft);transition:transform .2s}
.gv.open{transform:rotate(90deg)}
.row,.gh{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grp{border-radius:14px;margin-bottom:6px;padding-bottom:2px}
.grp.over{background:var(--glass-hi);outline:2px dashed var(--accent);outline-offset:3px}
.gemp{color:var(--soft);font-size:15px;margin:2px 2px 12px}
.ghint{color:var(--soft);font-size:14px;margin:2px 0 8px}
.row.drag{opacity:.3}
.row.ghost{position:fixed;z-index:100;pointer-events:none;margin:0;box-shadow:0 10px 28px var(--glass-s);transform:scale(1.03);opacity:.96}
.gbar{display:flex;gap:8px;margin-bottom:10px}
.gnew{display:flex;gap:8px;margin-bottom:12px}
.gnew input{flex:1;min-width:0}
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;border-radius:99px;padding:6px}
.dock button{display:flex;align-items:center;gap:8px;border:0;border-radius:99px;background:transparent;color:var(--ink);font:600 17px/1 "Source Sans 3",system-ui,sans-serif;padding:12px 26px;cursor:pointer}
.dock button[aria-current="true"]{background:var(--glass-hi);box-shadow:inset 0 1px 0 var(--glass-b)}
h2.t{font:700 clamp(36px,10vw,52px)/1.05 Caveat,cursive;margin:0 0 10px;overflow-wrap:anywhere}
h3{font:700 22px/1.2 Caveat,cursive;margin:22px 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.chip{padding:2px 10px;border-radius:99px;border:1.5px solid var(--todo);font-size:14px;font-weight:600}
.chip.fatta{border-color:var(--done)}
button.b{font:600 15px/1 "Source Sans 3",system-ui,sans-serif;padding:10px 13px;border-radius:8px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
button.b.p{background:var(--accent);border-color:var(--accent);color:var(--on)}
button.b.d{color:var(--soft)}
button.b.d.sure{border-color:#C0392B;color:#C0392B}
ul.ingr{list-style:none;margin:0;padding:0}
ul.ingr li{padding:4px 0;border-bottom:1px dashed var(--line)}
ul.ingr b{font-weight:600}
.mk{color:var(--soft);font-size:15px;font-style:italic}
.hbtn{display:flex;gap:8px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.src{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:99px;padding:2px 2px 2px 12px;font-size:14px;background:var(--card)}
.src button{border:0;background:transparent;color:var(--soft);font-size:15px;cursor:pointer;padding:4px 8px}
.sp{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);padding:11px 2px;cursor:pointer;font:inherit}
.bx{flex:none;width:24px;height:24px;border:2px solid var(--soft);border-radius:7px;margin-top:2px}
.sp.on .bx{background:var(--done);border-color:var(--done)}
.sp.on .bx::after{content:"✓";display:block;text-align:center;line-height:20px;font-size:16px;color:#fff}
.sp.on .spn{text-decoration:line-through;color:var(--soft)}
.spt{display:block}
.spn{display:block;font-size:18px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.empty{text-align:center;margin-top:14vh;color:var(--soft)}
label.l{display:block;font-weight:600;margin:16px 0 4px}
input,select,textarea{width:100%;font:16px/1.3 "Source Sans 3",system-ui,sans-serif;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.ing{display:grid;gap:6px;grid-template-columns:72px 1fr 40px;grid-template-areas:"n n n" "m m m" "q u x";margin-bottom:12px}
.ing .iq{grid-area:q}.ing .iu{grid-area:u}.ing .in{grid-area:n}.ing .im{grid-area:m}.ing .rm{grid-area:x;padding:0}
@media (min-width:720px){.ing{grid-template-columns:1fr 1fr 84px 140px 40px;grid-template-areas:"n m q u x";margin-bottom:8px}}
.actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Liquid glass ===== */
:root{--sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;--paper:#EDF0F9;--ink:#15181F;--soft:#667085;--line:rgba(60,72,110,.16);--accent:#0A7AFF;--on:#fff;--field:rgba(255,255,255,.55);--b1:rgba(110,165,255,.6);--b2:rgba(255,160,200,.5);--b3:rgba(165,140,255,.45);--gl:linear-gradient(135deg,rgba(255,255,255,.66),rgba(255,255,255,.3));--gl-b:rgba(255,255,255,.8);--gl-hi:rgba(255,255,255,.95);--gl-s:rgba(40,60,130,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0A0E19;--ink:#F2F4FA;--soft:#9AA3BA;--line:rgba(255,255,255,.14);--accent:#4C9BFF;--field:rgba(255,255,255,.08);--b1:rgba(40,100,255,.42);--b2:rgba(190,70,210,.3);--b3:rgba(20,170,190,.24);--gl:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));--gl-b:rgba(255,255,255,.2);--gl-hi:rgba(255,255,255,.3);--gl-s:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--paper:#0A0E19;--ink:#F2F4FA;--soft:#9AA3BA;--line:rgba(255,255,255,.14);--accent:#4C9BFF;--field:rgba(255,255,255,.08);--b1:rgba(40,100,255,.42);--b2:rgba(190,70,210,.3);--b3:rgba(20,170,190,.24);--gl:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));--gl-b:rgba(255,255,255,.2);--gl-hi:rgba(255,255,255,.3);--gl-s:rgba(0,0,0,.4)}
body{font-family:var(--sf)}
.grid{background-color:var(--paper);background-image:radial-gradient(70% 45% at 12% 6%,var(--b1),transparent 70%),radial-gradient(55% 40% at 95% 30%,var(--b2),transparent 70%),radial-gradient(70% 50% at 25% 100%,var(--b3),transparent 70%);background-size:auto}
.glass,.row,.gh,button.b,.chipb,.src,.sp,ul.ingr,.txt{background:var(--gl);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gl-b);box-shadow:inset 0 1px 1px var(--gl-hi),inset 0 -1px 2px rgba(255,255,255,.12),0 8px 22px var(--gl-s);color:var(--ink)}
.head h2{font:700 34px/1.1 var(--sf);letter-spacing:-.025em}
h2.t{font:700 30px/1.15 var(--sf);letter-spacing:-.02em}
.cover h1{font:700 clamp(36px,10vw,50px)/1.05 var(--sf);letter-spacing:-.03em}
.rt{font:600 18px/1.25 var(--sf)}
.rs{font-size:14px}
h3{font:600 20px/1.2 var(--sf)}
input,select,textarea,button.b,.chipb{font-family:var(--sf)}
.row{border-radius:22px;padding:14px 18px;margin-bottom:10px}
.row,.gh,button.b{transition:transform .15s}
.row:active,.gh:active,button.b:active{transform:scale(.98)}
.gh{border-radius:999px;padding:11px 12px 11px 20px;margin:6px 0 10px;font:600 17px/1.2 var(--sf)}
.gc{display:inline-block;background:var(--line);border-radius:99px;padding:2px 9px;margin-left:6px;font:600 13px/1.4 var(--sf);color:var(--soft)}
.gv{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gl);border:1px solid var(--gl-b);box-shadow:inset 0 1px 1px var(--gl-hi);font:600 22px/1 var(--sf);padding-bottom:3px;color:var(--soft)}
.grp{border-radius:30px}
.grp.over{outline:none;background:rgba(10,122,255,.1);box-shadow:0 0 0 2px var(--accent),0 0 28px rgba(10,122,255,.3)}
button.b{border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px}
button.b.p{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--accent);border:1px solid rgba(255,255,255,.4);color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 8px 20px rgba(10,122,255,.38)}
button.b.d{color:var(--soft)}
button.b.d.sure{color:#E5484D;border-color:rgba(229,72,77,.6);background:rgba(229,72,77,.12)}
.ing .rm{width:40px;height:40px;padding:0;border-radius:50%}
.plus{width:46px;height:46px}
.back{border-radius:999px;padding:9px 16px;font:600 16px/1 var(--sf)}
.chipb.on{background:var(--accent);color:#fff;border-color:transparent}
input,select,textarea{background:var(--field);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--gl-b);border-radius:16px;padding:12px 14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.05);color:var(--ink)}
textarea{border-radius:20px}
#search,#g-new{border-radius:999px;padding:12px 18px}
input::placeholder,textarea::placeholder{color:var(--soft);opacity:.8}
ul.ingr{border-radius:22px;padding:2px 16px}
ul.ingr li{border-bottom:1px solid var(--line);padding:10px 0}
ul.ingr li:last-child{border-bottom:0}
.txt{border-radius:22px;padding:14px 16px}
.sp{border-radius:20px;padding:12px 16px;margin-bottom:8px;gap:14px;width:100%}
.bx{width:26px;height:26px;border-radius:50%;background:var(--field)}
.sp.on .bx::after{line-height:22px}
#toast{background:rgba(24,26,34,.78);color:#fff;border-radius:999px;padding:11px 18px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2)}
/* ===== Gerarchia: ricette in primo piano ===== */
:root{--rc:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,255,255,.74));--tint:rgba(90,100,140,.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rc:linear-gradient(135deg,rgba(255,255,255,.27),rgba(255,255,255,.12));--tint:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--rc:linear-gradient(135deg,rgba(255,255,255,.27),rgba(255,255,255,.12));--tint:rgba(255,255,255,.07)}

<body>
<div id="pager"><section class="view grid" id="v-list" aria-label="Elenco ricette"></section><section class="view grid" id="v-form" aria-label="Scrivi ricetta"></section><section class="view grid" id="v-shop" aria-label="Lista della spesa"></section><section class="view grid" id="v-set" aria-label="Impostazioni"></section></div>

<nav id="tabbar" class="off" aria-label="Sezioni"><span id="tabind"></span><button class="tb on" data-act="tabgo" data-t="list" aria-label="Ricette"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V5.5"/><path d="M9 8h7"/></svg><span>Ricette</span></button><button class="tb" data-act="tabgo" data-t="form" aria-label="Nuova ricetta"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Nuova</span></button><button class="tb" data-act="tabgo" data-t="shop" aria-label="Spesa"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.2a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/></svg><span>Spesa</span></button><button class="tb" data-act="tabgo" data-t="settings" aria-label="Impostazioni"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Impostazioni</span></button></nav>

<script>
(function(){
var UNITS=["g","kg","ml","l","cucchiai","cucchiaini","tazze","pizzico","pezzi","spicchi","q.b."];
var LS="quaderno-ricette-v1";
var TABS=["list","form","shop","settings"],tab="list",recipes=[],selId=null,editing=null,sure=false,view="list",sq="",collapsed={},gsel="",groups=[],addingG=false,flt="tutte",scaleTo=0,shop={entries:[],checked:{}};
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function flash(m){var t=$("#toast");t.textContent=m;t.className="on";clearTimeout(flash.t);flash.t=setTimeout(function(){t.className=""},2600)}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){flash("Non riesco a salvare sul dispositivo.");return false}}
function saveLocal(){lsSet(LS,recipes)}
function upsert(r){var i=recipes.findIndex(function(x){return x.id===r.id});if(i<0)recipes.push(r);else recipes[i]=r}
function persist(r){upsert(r);saveLocal()}
function removeR(id){recipes=recipes.filter(function(x){return x.id!==id});saveLocal()}
var SA=false;try{SA=!!(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches))}catch(e){}
if(SA)document.documentElement.classList.add("sa");
function calibrate(){
  document.documentElement.style.setProperty("--bary",(settings.bary||0)+"px");
  document.documentElement.style.setProperty("--fix","0px");
}
window.addEventListener("resize",calibrate);
window.addEventListener("orientationchange",function(){setTimeout(calibrate,300)});
window.addEventListener("pageshow",calibrate);
var SK="quaderno-impostazioni-v1";
var settings={theme:"auto",size:"n",bar:"auto",bary:0,sort:"az",serv:0,awake:true};
var wl=null;
function loadSettings(){try{var o=JSON.parse(localStorage.getItem(SK)||"null");if(o&&typeof o==="object")Object.keys(settings).forEach(function(k){if(k in o)settings[k]=o[k]})}catch(e){}}
function saveSettings(){lsSet(SK,settings)}
function applySettings(){
  var h=document.documentElement;
  if(settings.theme==="auto")h.removeAttribute("data-theme");else h.setAttribute("data-theme",settings.theme);
  h.classList.toggle("big",settings.size==="l");
  var m=document.querySelectorAll('meta[name="theme-color"]');
  if(m.length===2){var c=settings.theme==="light"?["#F5F5F7","#F5F5F7"]:settings.theme==="dark"?["#1C1C1E","#1C1C1E"]:["#F5F5F7","#1C1C1E"];m[0].setAttribute("content",c[0]);m[1].setAttribute("content",c[1])}
  calibrate();
  wakeUpdate();
}
async function wakeUpdate(){
  try{
    var want=settings.awake&&view==="recipe"&&document.visibilityState==="visible"&&navigator.wakeLock;
    if(want&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",function(){wl=null})}
    else if(!want&&wl){var x=wl;wl=null;await x.release()}
  }catch(e){wl=null}
}
function backupObj(){return{app:"quaderno-ricette",v:1,recipes:recipes,groups:groups,shop:shop}}
function importBackup(txt){
  var o=JSON.parse(txt),rs=Array.isArray(o)?o:(o&&o.recipes);
  if(!Array.isArray(rs))throw new Error("x");
  var n=0;
  rs.forEach(function(r){
    if(!r||typeof r!=="object"||!r.id)return;
    if(!Array.isArray(r.ingredients))r.ingredients=[];
    var i=recipes.findIndex(function(x){return x.id===r.id});
    if(i<0){recipes.push(r);n++}else if((r.updated||0)>(recipes[i].updated||0)){recipes[i]=r;n++}
  });
  if(o&&Array.isArray(o.groups))o.groups.forEach(function(g){g=String(g||"").trim();if(g&&!groups.some(function(x){return x.toLowerCase()===g.toLowerCase()}))groups.push(g)});
  if(o&&o.shop&&Array.isArray(o.shop.entries)&&!shop.entries.length)shop={entries:o.shop.entries,checked:o.shop.checked||{}};
  saveLocal();persistGroups();persistShop();
  return n;
}
function seg(k,opts){return '<div class="seg">'+opts.map(function(o){var on=String(settings[k])===String(o[0]);return '<button class="chipb'+(on?" on":"")+'" data-act="set" data-k="'+k+'" data-v="'+o[0]+'" aria-pressed="'+on+'">'+o[1]+'</button>'}).join("")+'</div>'}
function diag(){
  try{
    var pr=document.createElement("div");
    pr.style.cssText="position:fixed;left:0;bottom:0;width:0;visibility:hidden;height:env(safe-area-inset-bottom,0px)";
    document.body.appendChild(pr);var sb=pr.offsetHeight;document.body.removeChild(pr);
    var pt=document.createElement("div");
    pt.style.cssText="position:fixed;left:0;top:0;width:0;visibility:hidden;height:env(safe-area-inset-top,0px)";
    document.body.appendChild(pt);var st=pt.offsetHeight;document.body.removeChild(pt);
    var port=window.innerHeight>=window.innerWidth,sh=port?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
    return "Schermo "+sh+" · finestra "+window.innerHeight+" · margine alto "+st+", basso "+sb+" · modalità app: "+(SA?"sì":"no")+" · spostamento "+(settings.bary||0)+"px";
  }catch(e){return ""}
}
function setHTML(){
  var canWake=!!navigator.wakeLock,on=!!settings.awake;
  return '<div class="sheet"><div class="head"><h2>Impostazioni</h2></div>'+
  '<div class="sct">Aspetto</div><div class="setc">'+
    '<div class="srow col"><div class="sl">Tema</div>'+seg("theme",[["auto","Automatico"],["light","Chiaro"],["dark","Scuro"]])+'</div>'+
    '<div class="srow col"><div class="sl">Dimensione del testo</div>'+seg("size",[["n","Normale"],["l","Grande"]])+'</div>'+
    '<div class="srow col"><div class="sl">Posizione della barra</div><div class="sh">Se la barra è troppo in alto o troppo in basso, spostala qui. Ogni tocco sposta di pochi millimetri.</div><div class="acts"><button class="b" data-act="bary" data-d="8">Più in basso</button><button class="b" data-act="bary" data-d="-8">Più in alto</button><button class="b" data-act="bary" data-d="0">Ripristina</button></div><div class="sh" style="margin-top:10px">'+esc(diag())+'</div></div>'+
  '</div>'+
  '<div class="sct">Ricette</div><div class="setc">'+
    '<div class="srow col"><div class="sl">Ordine della lista</div>'+seg("sort",[["az","A–Z"],["recent","Ultime modificate"]])+'</div>'+
    '<div class="srow col"><div class="sl">Persone predefinite</div><div class="sh">Quante persone compaiono già nelle nuove ricette.</div>'+seg("serv",[[0,"Nessuna"],[2,"2"],[4,"4"],[6,"6"]])+'</div>'+
  '</div>'+
  '<div class="sct">In cucina</div><div class="setc">'+
    '<div class="srow"><div><div class="sl">Schermo sempre acceso</div><div class="sh">'+(canWake?"Resta acceso mentre guardi una ricetta, utile mentre cucini.":"Questo browser non lo permette.")+'</div></div><button class="sw'+(on?" on":"")+'" role="switch" aria-checked="'+on+'" aria-label="Schermo sempre acceso" data-act="swap"></button></div>'+
  '</div>'+
  '<div class="sct">Dati</div><div class="setc">'+
    '<div class="srow col"><div class="sl">'+recipes.length+(recipes.length===1?" ricetta":" ricette")+', '+groupNames().length+(groupNames().length===1?" gruppo":" gruppi")+'</div><div class="sh">Sono salvati solo su questo dispositivo. Ogni tanto fai un backup: se il browser cancella i dati, puoi ripristinarli da qui.</div><div class="acts"><button class="b" data-act="bkcopy">Copia backup</button></div></div>'+
    '<div class="srow col"><div class="sl">Ripristina da backup</div><div class="sh">Incolla qui il backup copiato. Le ricette si aggiungono a quelle che hai, senza cancellare niente.</div><textarea id="bk-text" placeholder="Incolla il backup" aria-label="Backup da importare"></textarea><div class="acts"><button class="b" data-act="bkimp">Importa</button></div></div>'+
    '<div class="srow col"><div class="sl">Cancella tutti i dati</div><div class="sh">Toglie ricette, gruppi e lista della spesa da questo dispositivo.</div><div class="acts">'+(sure?'<button class="b d sure" data-act="wipe">Conferma: cancella tutto</button><button class="b" data-act="wipeno">Annulla</button>':'<button class="b d" data-act="wipe0">Cancella tutto</button>')+'</div></div>'+
  '</div>'+
  '<p class="sh" style="text-align:center;margin:18px 0 0">Quaderno di ricette</p></div>';
}
function sorted(){return recipes.slice().sort(function(a,b){if(settings.sort==="recent")return (b.updated||0)-(a.updated||0);return (a.title||"").localeCompare(b.title||"","it")})}
function cur(){return recipes.find(function(r){return r.id===selId})}
function num(s){s=String(s||"").trim().replace(",",".");var m=s.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);if(m)return +m[1]/+m[2];return /^\d+(\.\d+)?$/.test(s)?+s:NaN}
function fmt(x){return String(Math.round(x*100)/100).replace(".",",")}
function scaleQ(q,k){if(!q||!k||k===1)return q;var v=num(q);return isNaN(v)?q:fmt(v*k)}
function line(i,k){var q=esc(scaleQ(i.q,k)),n=esc(i.n),m=i.m?' <span class="mk">'+esc(i.m)+'</span>':"";if(i.u==="q.b.")return "<b>"+n+"</b> q.b."+(q?" ("+q+")":"")+m;return (q?"<b>"+q+"</b> ":"")+(i.u?esc(i.u)+" ":"")+n+m}
var PLUS='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
var GEAR='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>';
var EDIT='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
var CAM='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
var CART='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2.5l2.2 11h10.6l2-8H6.5"/></svg>';
function persistShop(){lsSet("quaderno-spesa-v1",shop)}
function persistGroups(){lsSet("quaderno-gruppi-v1",groups)}
function toObj(c){if(Array.isArray(c)){var o={};c.forEach(function(k){o[k]=true});return o}return c||{}}
function lkey(l){return (l.n||"").trim().toLowerCase()+"|"+(l.u||"")+"|"+(l.m||"").trim().toLowerCase()}
function shopRows(){
  var map={},arr=[];
  shop.entries.forEach(function(e){e.lines.forEach(function(l){
    var k=lkey(l),r=map[k];
    if(!r){r=map[k]={key:k,n:l.n,u:l.u,m:l.m,sum:0,txt:[],srcs:[]};arr.push(r)}
    var v=num(l.q);
    if(l.q&&!isNaN(v))r.sum+=v;else if(l.q&&l.u!=="q.b."&&r.txt.indexOf(l.q)<0)r.txt.push(l.q);
    r.srcs.push(e.title+(l.q?" ("+l.q+(l.u&&l.u!=="q.b."?" "+l.u:"")+")":""));
  })});
  arr.forEach(function(r){r.src=r.srcs.join(", ")});
  return arr.sort(function(a,b){return (a.n||"").localeCompare(b.n||"","it")});
}
function shopHTML(){
  var rows=shopRows();
  var chips=shop.entries.map(function(e){return '<span class="src">'+esc(e.title)+(e.people?' ('+e.people+')':"")+'<button data-act="shrm" data-id="'+esc(e.rid)+'" aria-label="Togli '+esc(e.title)+' dalla spesa">✕</button></span>'}).join("");
  var list=rows.map(function(r){
    var on=!!shop.checked[r.key];
    var q=r.sum>0?'<b>'+fmt(r.sum)+'</b> ':'';
    var u=r.u&&r.u!=="q.b."?esc(r.u)+' ':'';
    var tail=r.u==="q.b."?' q.b.':'';
    var extra=r.txt.length?' ('+esc(r.txt.join(", "))+')':'';
    return '<button class="sp'+(on?' on':'')+'" data-act="chk" data-k="'+esc(r.key)+'" aria-pressed="'+on+'"><span class="bx"></span><span class="spt"><span class="spn">'+q+u+esc(r.n)+tail+extra+(r.m?' <span class="mk">'+esc(r.m)+'</span>':'')+'</span><span class="rs">'+esc(r.src)+'</span></span></button>';
  }).join("");
  return '<div class="sheet"><div class="head"><h2>Spesa</h2></div>'+
  (chips?'<div class="srcs">'+chips+'</div>':'')+
  (list||'<div class="empty">La lista è vuota. Apri una ricetta e tocca «Aggiungi alla spesa».</div>')+
  (list?'<div class="actions"><button class="b" data-act="shdone">Togli i già presi</button><button class="b" data-act="shcopy">Copia lista</button><button class="b d'+(sure?' sure':'')+'" data-act="'+(sure?'shclr':'shclr0')+'">'+(sure?'Conferma: svuota':'Svuota la lista')+'</button></div>':'')+'</div>';
}
function copyText(t,msg){msg=msg||"Lista copiata.";
  function fb(){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);flash(ok?msg:"Non riesco a copiare.")}

    var t=TABS[Math.round(p)];if(t===view)return;
    if(view==="form"&&editing&&$("#f-title"))collect();
    view=t;tab=t;sure=false;
    if(t==="form"){if(!editing)editing=loadDraft()||newDraft();$("#v-form").innerHTML=formHTML()}
  },140);
},{passive:true});
var scrub=null,tbar=$("#tabbar");
tbar.addEventListener("pointerdown",function(e){scrub={x:e.clientX,moved:false}});
tbar.addEventListener("pointermove",function(e){
  if(!scrub)return;
  if(!scrub.moved&&Math.abs(e.clientX-scrub.x)<8)return;
  scrub.moved=true;
  var rc=tbar.getBoundingClientRect(),w=(rc.width-8)/TABS.length,i=Math.max(0,Math.min(TABS.length-1,Math.floor((e.clientX-rc.left-4)/w)));
  if(i!==TABS.indexOf(tab)&&TABS.indexOf(view)>=0){try{if(navigator.vibrate)navigator.vibrate(8)}catch(x){}go(TABS[i])}
});
function scrubEnd(){if(scrub&&scrub.moved){suppress=true;setTimeout(function(){suppress=false},400)}scrub=null}
tbar.addEventListener("pointerup",scrubEnd);
tbar.addEventListener("pointercancel",scrubEnd);
document.addEventListener("focusin",function(e){if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))tbar.classList.add("kb")});
document.addEventListener("focusout",function(){setTimeout(function(){var a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))tbar.classList.remove("kb")},60)});
var dT=null;
function saveDraft(){try{if(editing&&editing.isNew&&$("#f-title")){collect();localStorage.setItem("quaderno-bozza-v1",JSON.stringify(editing))}}catch(e){}}
document.addEventListener("input",function(e){if(e.target.closest&&e.target.closest("#v-form")){clearTimeout(dT);dT=setTimeout(saveDraft,400)}});
document.addEventListener("change",function(e){
  var t=e.target;if(!t||(t.id!=="ph-cam"&&t.id!=="ph-lib"))return;
  var f=t.files&&t.files[0];if(!f)return;
  readPhoto(f,function(url){collect();editing.photo=url;render(true);saveDraft();flash("Foto aggiunta.")});
});
document.addEventListener("input",function(e){if(e.target.id==="search"){sq=e.target.value;$("#rows").innerHTML=rowsHTML()}});
recipes=loadLocal();
try{var gj=JSON.parse(localStorage.getItem("quaderno-gruppi-v1")||"null");if(Array.isArray(gj))groups=gj}catch(e){}
try{var sj=JSON.parse(localStorage.getItem("quaderno-spesa-v1")||"null");if(sj&&sj.entries)shop=sj}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
loadSettings();applySettings();
document.addEventListener("visibilitychange",wakeUpdate);
editing=loadDraft()||newDraft();
render(true);
})();
</script>
