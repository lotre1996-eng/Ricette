<title>Ever</title>
<style>
:root{--paper:#FDFDFB;--grid:#D9E4F4;--ink:#1C2A4A;--soft:#55627F;--line:#C3CDDF;--accent:#2447B3;--on:#fff;--done:#2F8F5B;--todo:#E0B100;--field:#fff;--card:#fff;--glass:rgba(255,255,255,.4);--glass-hi:rgba(255,255,255,.7);--glass-b:rgba(255,255,255,.8);--glass-s:rgba(28,42,74,.22);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#151D2E;--grid:#202D47;--ink:#E8ECF5;--soft:#9AA7C2;--line:#2C3A57;--accent:#7C9BFF;--on:#0F1624;--done:#4CC38A;--todo:#F2C94C;--field:#0F1624;--card:#1B2538;--glass:rgba(44,58,87,.45);--glass-hi:rgba(255,255,255,.16);--glass-b:rgba(255,255,255,.2);--glass-s:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#151D2E;--grid:#202D47;--ink:#E8ECF5;--soft:#9AA7C2;--line:#2C3A57;--accent:#7C9BFF;--on:#0F1624;--done:#4CC38A;--todo:#F2C94C;--field:#0F1624;--card:#1B2538;--glass:rgba(44,58,87,.45);--glass-hi:rgba(255,255,255,.16);--glass-b:rgba(255,255,255,.2);--glass-s:rgba(0,0,0,.55);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
.grid{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 24px 110px}
.cover h1{font:700 clamp(46px,13vw,76px)/1 Caveat,cursive;margin:0 0 10px}
.cover p{margin:0;color:var(--soft)}
.cover .big{margin-top:26px;padding:15px 40px;font-size:18px;border-radius:99px}
.cover .small{margin-top:14px;font-size:14px}
.view{scrollbar-width:none;position:fixed;inset:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(40px + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.view.on{visibility:visible;transform:none;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.view::-webkit-scrollbar{display:none}
#v-list{z-index:10;transform:translateY(100%)}
#v-recipe{z-index:11;transform:translateX(100%)}
#v-form{z-index:12;transform:translateX(100%)}
#v-shop{z-index:11;transform:translateX(100%)}
#v-list.on,#v-recipe.on,#v-form.on,#v-shop.on{transform:none}
.sheet{max-width:640px;margin:0 auto}
.fbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fbar .back{margin:0}
.fbar .b{padding:11px 20px;border-radius:99px;font-size:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.head h2{font:700 clamp(40px,11vw,56px)/1 Caveat,cursive;margin:0}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--glass-b),0 8px 24px var(--glass-s);color:var(--ink)}
.plus{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;font:inherit}
.back{border-radius:99px;padding:8px 14px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;margin-bottom:10px}
.row{display:block;width:100%;text-align:left;border:0;border-left:8px solid var(--accent);border-radius:4px 14px 14px 4px;background:var(--card);color:var(--ink);padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 0 var(--line);font-family:inherit}
.row.fatta{border-left-color:var(--done)}
.rt{display:block;font:700 26px/1.1 Caveat,cursive;overflow-wrap:anywhere}
.rs{display:block;font-size:14px;color:var(--soft)}
#search{margin-bottom:8px}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chipb{border:1.5px solid var(--line);background:var(--field);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 15px/1 "Source Sans 3",system-ui,sans-serif;cursor:pointer}
.chipb.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.serv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 2px;font-size:18px}
.gh{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);font:700 28px/1.2 Caveat,cursive;padding:10px 2px 4px;margin:14px 0 10px;cursor:pointer;text-align:left}
.gc{font:600 14px "Source Sans 3",system-ui,sans-serif;color:var(--soft)}
.gv{font:600 26px/1 "Source Sans 3",system-ui,sans-serif;color:var(--soft);transition:transform .2s}
.gv.open{transform:rotate(90deg)}
.row,.gh{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grp{border-radius:14px;margin-bottom:6px;padding-bottom:2px}
.grp.over{background:var(--glass-hi);outline:2px dashed var(--accent);outline-offset:3px}
.gemp{color:var(--soft);font-size:15px;margin:2px 2px 12px}
.ghint{color:var(--soft);font-size:14px;margin:2px 0 8px}
.row.drag{opacity:.3}

/* ===== Sfumatura col bianco, scuro neutro ===== */
:root{--paper:#FFFDF2;--g1:#FFEDA6;--g2:#FFF9E0;--g3:#FFFFFF;--ink:#1C1B18;--soft:#55524A;--line:rgba(90,80,50,.16);--fb:rgba(100,90,60,.42);--gl-s:rgba(40,40,30,.14);--tint:rgba(90,80,50,.1);--gl:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.66));--rc:linear-gradient(135deg,rgba(255,255,255,.98),rgba(255,255,255,.8))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E0E10;--g1:#2A2A2E;--g2:#161618;--g3:#0B0B0C;--ink:#F5F5F7;--soft:#C9C9CF;--line:rgba(255,255,255,.14);--accent:#FFD24D;--field:rgba(255,255,255,.1);--fb:rgba(255,255,255,.38);--gl:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.08));--gl-b:rgba(255,255,255,.2);--gl-hi:rgba(255,255,255,.3);--gl-s:rgba(0,0,0,.55);--rc:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.12));--tint:rgba(255,255,255,.09);--danger:#FF8A80}}
:root[data-theme="dark"]{--paper:#0E0E10;--g1:#2A2A2E;--g2:#161618;--g3:#0B0B0C;--ink:#F5F5F7;--soft:#C9C9CF;--line:rgba(255,255,255,.14);--accent:#FFD24D;--field:rgba(255,255,255,.1);--fb:rgba(255,255,255,.38);--gl:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.08));--gl-b:rgba(255,255,255,.2);--gl-hi:rgba(255,255,255,.3);--gl-s:rgba(0,0,0,.55);--rc:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.12));--tint:rgba(255,255,255,.09);--danger:#FF8A80}
.grid{background-color:var(--paper);background-image:linear-gradient(180deg,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%);background-size:auto}
/* ===== Stile Telegram + foto ricetta ===== */
:root{--paper:#FFFFFF;--pg:#F2F2F7;--pgl:#FFFFFF;--top:#F5F5F7;--card:#FFFFFF;--sep:rgba(60,60,67,.2);--press:rgba(60,60,67,.09);--sbg:#E8E8EB;--ink:#0B0B0C;--soft:#5F5F64;--accent:#8A5A00;--line:rgba(60,60,67,.18);--fb:rgba(60,60,67,.32);--field:#FFFFFF;--gl:linear-gradient(rgba(255,255,255,.84),rgba(255,255,255,.7));--gl-b:rgba(0,0,0,.07);--gl-hi:rgba(255,255,255,.9);--gl-s:rgba(0,0,0,.1);--tint:rgba(60,60,67,.08);--rc:linear-gradient(#fff,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#000000;--pg:#000000;--pgl:#000000;--top:#1C1C1E;--card:#1C1C1E;--sep:rgba(255,255,255,.16);--press:rgba(255,255,255,.08);--sbg:#2C2C2E;--ink:#FFFFFF;--soft:#A1A1A6;--accent:#FFD24D;--line:rgba(255,255,255,.14);--fb:rgba(255,255,255,.28);--field:#2C2C2E;--gl:linear-gradient(rgba(70,70,74,.74),rgba(46,46,50,.64));--gl-b:rgba(255,255,255,.14);--gl-hi:rgba(255,255,255,.2);--gl-s:rgba(0,0,0,.5);--tint:rgba(255,255,255,.08);--rc:linear-gradient(#1C1C1E,#1C1C1E)}}
:root[data-theme="dark"]{--paper:#000000;--pg:#000000;--pgl:#000000;--top:#1C1C1E;--card:#1C1C1E;--sep:rgba(255,255,255,.16);--press:rgba(255,255,255,.08);--sbg:#2C2C2E;--ink:#FFFFFF;--soft:#A1A1A6;--accent:#FFD24D;--line:rgba(255,255,255,.14);--fb:rgba(255,255,255,.28);--field:#2C2C2E;--gl:linear-gradient(rgba(70,70,74,.74),rgba(46,46,50,.64));--gl-b:rgba(255,255,255,.14);--gl-hi:rgba(255,255,255,.2);--gl-s:rgba(0,0,0,.5);--tint:rgba(255,255,255,.08);--rc:linear-gradient(#1C1C1E,#1C1C1E)}
.grid{background:var(--pg)}
#pager #v-list{background:var(--pgl);padding-left:0;padding-right:0}
.top{margin:calc(-1*(env(safe-area-inset-top,0px) + 14px)) 0 0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:var(--top);border-bottom:.5px solid var(--sep)}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:12px}
.hdr h2{font:700 18px/1 var(--sf);margin:0;text-align:center;letter-spacing:0}
.hl{justify-self:start}
.hr{justify-self:end;display:flex;gap:8px}
.hdr .b,.hdr .plus{background:var(--gl);border:1px solid var(--gl-b);box-shadow:0 1px 3px var(--gl-s)}
.plus.gold{background:linear-gradient(180deg,#FFE681,#F7BC24);border:1px solid rgba(255,255,255,.6);color:#3A2800;box-shadow:0 6px 16px rgba(214,155,0,.35)}
#search{width:100%;box-sizing:border-box;background-color:var(--sbg);border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:999px;padding:12px 18px 12px 44px;font-size:17px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%238E8E93' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>");background-repeat:no-repeat;background-position:16px center}
#search::-webkit-search-cancel-button{-webkit-appearance:none}
.ghint{margin:10px 2px 0}
.gnew{margin:10px 0 0}
.row{display:flex;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 0 0 16px;margin:0}
.row:active{transform:none;background:var(--press)}
.row.ghost{background:var(--card);border-radius:18px;padding-right:12px;box-shadow:0 14px 34px rgba(0,0,0,.28);border:1px solid var(--sep)}
.av{flex:0 0 auto;width:56px;height:56px;border-radius:50%;margin-right:12px;display:grid;place-items:center;overflow:hidden;color:#fff;font:700 24px/1 var(--sf)}
.av img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-touch-callout:none;-webkit-user-drag:none}
.av0{background:linear-gradient(135deg,#FF9A5A,#FF6B6B)}
.av1{background:linear-gradient(135deg,#FFD166,#F7A21B)}
.av2{background:linear-gradient(135deg,#7BD389,#3DAE6A)}
.av3{background:linear-gradient(135deg,#6EC6FF,#3A8DEB)}
.av4{background:linear-gradient(135deg,#B79CFF,#7C5CE0)}
.av5{background:linear-gradient(135deg,#FF8FB8,#E5508E)}
.rtx{flex:1;min-width:0;padding:11px 16px 11px 0;border-bottom:.5px solid var(--sep);display:flex;flex-direction:column;gap:3px}
.rline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rt{font:600 17px/1.25 var(--sf);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rs{font-size:14px;color:var(--soft);flex:0 0 auto}
.rsub{font:400 15px/1.3 var(--sf);color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{border-radius:0;margin:0;padding:0}
.grp.over{background:rgba(247,188,36,.16);box-shadow:inset 0 0 0 2px #F7BC24}
.gh{display:flex;border-radius:0;width:100%;margin:0;padding:8px 16px;background:var(--top);color:var(--soft);font:600 13px/1.2 var(--sf);box-shadow:none;border:0;border-bottom:.5px solid var(--sep);-webkit-backdrop-filter:none;backdrop-filter:none}
.gemp{padding:10px 16px 0}
.grp button.b.d{margin:0 0 10px 16px}
#tabbar{width:min(360px,calc(100% - 36px));padding:4px;border-radius:30px;background:var(--gl);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:1px solid var(--gl-b);box-shadow:0 10px 30px var(--gl-s)}
#tabind{background:rgba(247,188,36,.24);border:0;box-shadow:none}
.tb{color:var(--ink);font-weight:600}
.tb.on{color:var(--accent)}
.phb{display:flex;flex-direction:column;align-items:center;gap:12px;margin:6px 0 4px}
.phv{width:96px;height:96px;border-radius:50%;background:var(--card);border:1px solid var(--sep);display:grid;place-items:center;overflow:hidden;color:var(--soft)}
.phv img{display:block;width:100%;height:100%;object-fit:cover}
.pha{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rph{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:22px;margin:4px 0 12px}
/* ===== Tag orizzontali per i gruppi, barra a 4 schede ===== */
.hdr{display:block;margin-bottom:12px}
.hdr h2{text-align:center}
.gchw{height:46px;margin-top:12px}
.gch{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:3px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.gch::-webkit-scrollbar{display:none}
.gchip{flex:0 0 auto;height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--sep);background:var(--card);color:var(--ink);font:600 16px/1 var(--sf);box-shadow:0 1px 3px var(--gl-s);cursor:pointer;white-space:nowrap;-webkit-user-select:none;user-select:none;transition:transform .15s}
.gchip.add{background:rgba(247,188,36,.16);border-color:rgba(247,188,36,.55);color:var(--accent)}
.gchip.on{background:linear-gradient(180deg,#FFE681,#F7BC24);border-color:rgba(255,255,255,.6);color:#3A2800;box-shadow:0 6px 16px rgba(214,155,0,.32)}
.gchip.over{outline:3px solid #F7BC24;outline-offset:1px;transform:scale(1.06)}
body.dragging .gch{position:fixed;left:0;right:0;top:0;z-index:60;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 10px;background:var(--top);border-bottom:.5px solid var(--sep);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.gtools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--top);border-bottom:.5px solid var(--sep);font:600 14px/1.2 var(--sf);color:var(--soft)}
.gtools button.b{padding:6px 12px;font-size:14px;background:none;border:0;box-shadow:none;color:var(--danger);-webkit-backdrop-filter:none;backdrop-filter:none}
#tabbar{grid-template-columns:repeat(4,1fr);width:min(400px,calc(100% - 24px))}
#tabind{width:calc((100% - 8px)/4)}
.tb{font-size:10.5px}
.bar{flex-wrap:wrap}
/* ===== iPhone a schermo intero: alto e barra in basso ===== */
:root{padding:0}
html{scroll-padding-top:0}
.view{padding-top:calc(env(safe-area-inset-top,0px) + 30px)}
.top{margin-top:calc(-1*(env(safe-area-inset-top,0px) + 30px));padding-top:calc(env(safe-area-inset-top,0px) + 30px)}
html.sa #pager,html.sa #v-recipe{bottom:calc(-1*var(--fix,0px))}
html.sa #tabbar{bottom:calc(8px + env(safe-area-inset-bottom,0px) - var(--fix,0px))}
html.sa #toast{bottom:calc(90px + env(safe-area-inset-bottom,0px) - var(--fix,0px))}
/* ===== Tutto un po' più piccolo + menu a pressione lunga ===== */
body{font-size:16px}
.head h2{font-size:30px}
h2.t{font-size:26px}
h3{font-size:18px}
.hdr h2{font-size:17px}
.top{padding-left:14px;padding-right:14px}
.row{padding-left:14px}
.rtx{padding:9px 14px 9px 0;gap:2px}
.av{width:48px;height:48px;margin-right:11px;font-size:21px}
.rt{font-size:16px}
.row .rs{font-size:12.5px}
.rsub{font-size:13.5px}
.gtools{padding:8px 14px;font-size:13px}
.gtools button.b{font-size:13px}
.gemp{padding:10px 14px 0}
#search{padding:10px 16px 10px 40px;font-size:16px;background-position:14px center;background-size:16px}
.gchw{height:38px;margin-top:10px}
.gchip{height:32px;padding:0 13px;font-size:13.5px}
button.b{padding:9px 15px;font-size:14px}
.plus{width:40px;height:40px}
.back{padding:8px 14px;font-size:15px}
input,select,textarea{padding:10px 12px;font-size:16px;border-radius:14px}
textarea{border-radius:18px}
#search,#g-new{border-radius:999px}
#tabbar{width:min(370px,calc(100% - 28px));border-radius:26px}
#tabind{border-radius:22px}
.tb{padding:6px 0 5px;font-size:10px;gap:2px}
.tb svg{width:20px;height:20px}
.sl{font-size:15px}
.sh{font-size:12.5px}
.sct{font-size:12px;margin:18px 6px 6px}
.srow{padding:11px 0}
.setc{border-radius:20px}
.seg .chipb{padding:7px 12px;font-size:13px}
.sw{width:48px;height:30px}
.sw::after{width:24px;height:24px}
.sw.on::after{transform:translateX(18px)}
.phv{width:84px;height:84px}
.rph{max-height:220px}
ul.ingr{padding:2px 14px}
ul.ingr li{padding:9px 0}
.txt{padding:12px 14px}
.sp{padding:10px 14px}
html.big body{font-size:18px}
html.big .rt{font-size:19px}
html.big .sl{font-size:17px}
#pmask{position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.08)}
#pmenu{position:fixed;z-index:80;min-width:170px;max-width:230px;max-height:50vh;overflow-y:auto;padding:6px;border-radius:18px;background:var(--rc);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--sep);box-shadow:0 14px 40px rgba(0,0,0,.28)}
.pmh{padding:6px 12px 4px;font:600 11px/1.2 var(--sf);letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.pmn{padding:8px 12px 10px;font:400 13px/1.35 var(--sf);color:var(--soft)}
button.pm{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:10px;font:500 15px/1.2 var(--sf);color:var(--ink);cursor:pointer}
button.pm:active{background:var(--press)}
button.pm.pmx{color:var(--danger)}
.pmc{color:var(--accent);font-weight:700}
.row.pressed{background:var(--press)}
/* ===== Niente selezione accidentale del testo ===== */
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
.txt,.txt *,ul.ingr,ul.ingr *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#pmask{touch-action:none}
/* ===== Barra in basso: base come Telegram + regolazione manuale ===== */
#tabbar{bottom:calc(8px + env(safe-area-inset-bottom,0px) - var(--bary,0px))}
html.sa #tabbar{bottom:calc(max(6px, env(safe-area-inset-bottom,0px) - 10px) - var(--fix,0px) - var(--bary,0px))}
html.sa #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px) - var(--fix,0px) - var(--bary,0px))}
/* ===== Barra in basso: ancorata al limite dello schermo disponibile ===== */
html.sa #pager,html.sa #v-recipe{bottom:0}
html.sa #tabbar{bottom:max(0px,calc(max(8px,env(safe-area-inset-bottom,0px) - 8px) - var(--bary,0px)))}
html.sa #toast{bottom:calc(78px + max(0px,env(safe-area-inset-bottom,0px) - 8px))}
/* ===== Scheda Menù ===== */
#v-dish{z-index:12;transform:translateX(100%)}
#v-dish.on{transform:none}
#pager #v-menu{background:var(--pgl);padding-left:0;padding-right:0}
button.b.p.wide{width:100%;margin-top:12px;padding:11px 16px;font-size:15px}
#tabbar{grid-template-columns:repeat(5,1fr);width:min(400px,calc(100% - 16px))}
#tabind{width:calc((100% - 8px)/5)}
.tb span{white-space:nowrap}
#dsearch{margin-bottom:8px}
#dsearch,#g-new{border-radius:999px;padding:12px 18px}
#dsearch{width:100%;box-sizing:border-box;background-color:var(--sbg);border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:999px;padding:12px 18px 12px 44px;font-size:17px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%238E8E93' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>");background-repeat:no-repeat;background-position:16px center}
#dsearch::-webkit-search-cancel-button{-webkit-appearance:none}
#dsearch{padding:10px 16px 10px 40px;font-size:16px;background-position:14px center;background-size:16px}
#dsearch,#g-new{border-radius:999px}
ul.ingr .ide{display:block;margin-top:2px;font:400 12.5px/1.35 var(--sf);color:var(--soft);font-style:normal}
html.big ul.ingr .ide{font-size:14px}
/* ===== Allergeni ===== */
.al{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:rgba(247,188,36,.26);color:var(--accent);font:700 10.5px/1 var(--sf);box-sizing:border-box}
.alb{display:inline-flex;flex-wrap:wrap;gap:3px;vertical-align:middle}
ul.ingr .alb{margin-left:7px}
.rline .alb{flex:0 1 auto;justify-content:flex-end;max-width:48%;margin-left:6px}
.rline .rsub{flex:1;min-width:0}
.alsum{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:2px 0 10px}
.alc{display:inline-flex;align-items:center;gap:5px;font:500 13px/1 var(--sf);color:var(--ink)}
.alx{font:600 12px/1 var(--sf);color:var(--soft)}
.alm,.alnone{font:400 12px/1 var(--sf);color:var(--soft)}
.alv{display:inline-flex;flex-wrap:wrap;gap:3px}
.ing .ial{grid-area:auto;grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:2px}
.alt0{padding:4px 10px;font-size:12px;margin-left:auto}
.alp{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.alp .chipb{padding:6px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.leg{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.leg .al{min-width:26px;height:26px;border-radius:13px;font-size:13px;flex:0 0 auto}
/* ===== Piatti composti da ricette ===== */
#v-pick{z-index:13;transform:translateX(100%);background:var(--pgl);padding-left:0;padding-right:0}
#v-pick.on{transform:none}
.dcmp{margin-top:14px}
.dcmp>.sl{display:block;margin-bottom:8px}
.dcr{display:flex;align-items:center;gap:10px;background:var(--rc);border:1px solid var(--sep);border-radius:16px;padding:6px 6px 6px 8px;margin-bottom:8px}
.dcr .av{width:36px;height:36px;margin:0;font-size:16px}
.dcl{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 0;font:600 15px/1.2 var(--sf);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.dcr .b.rm{width:34px;height:34px;padding:0;border-radius:50%}
.pck{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--fb);display:grid;place-items:center;font:700 14px/1 var(--sf);color:#3A2800;margin-left:auto;box-sizing:border-box}
.pck.on{background:linear-gradient(180deg,#FFE681,#F7BC24);border-color:transparent}
#psearch{margin-bottom:8px}
#psearch,#g-new{border-radius:999px;padding:12px 18px}
#psearch{width:100%;box-sizing:border-box;background-color:var(--sbg);border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:999px;padding:12px 18px 12px 44px;font-size:17px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%238E8E93' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>");background-repeat:no-repeat;background-position:16px center}
#psearch::-webkit-search-cancel-button{-webkit-appearance:none}
#psearch{padding:10px 16px 10px 40px;font-size:16px;background-position:14px center;background-size:16px}
#psearch,#g-new{border-radius:999px}
/* ===== Tendine: ingredienti e impostazioni ===== */
.chv{flex:0 0 auto;color:var(--soft);font:600 20px/1 var(--sf);transition:transform .2s}
.ingw{border:1px solid var(--sep);border-radius:16px;background:var(--rc);margin-bottom:8px;overflow:hidden}
.ingh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:11px 12px;font:600 15px/1.2 var(--sf);color:var(--ink);cursor:pointer}
.ingh .ht{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ingh .ht.empty{color:var(--soft);font-weight:500}
.ingh .chv{transform:rotate(90deg)}
.ingw.c .ingh .chv{transform:rotate(0)}
.ingb{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease}
.ingw.c .ingb{grid-template-rows:0fr}
.ingin{overflow:hidden;min-height:0}
.ingw.c .ingin{visibility:hidden;transition:visibility 0s .25s}

}

function hideLogin(){var l=$("#v-login");if(l)l.className="hide"}
async function onSignedIn(user){
  if(signing)return;signing=true;
  try{
    curUser=user;lsDel(MODEK);hideLogin();
    await cloudLoad(true);
    if(!profile.email&&user.email){profile.email=user.email;saveProfile()}
    render(false);
  }finally{signing=false}
}
async function authInit(){
  var gm=lsGet(MODEK)==="guest";
  if(!sb){if(gm)hideLogin();else showLogin();return}
  try{
    sb.auth.onAuthStateChange(function(ev,s){
      if(ev==="SIGNED_OUT"){curUser=null;syncSt={s:"idle",t:0,m:""};if(lsGet(MODEK)!=="guest")showLogin()}
      else if(ev==="SIGNED_IN"&&s&&s.user&&(!curUser||curUser.id!==s.user.id)){setTimeout(function(){onSignedIn(s.user)},0)}
    });
    var r=await sb.auth.getSession(),ses=r&&r.data&&r.data.session;
    if(ses&&ses.user)await onSignedIn(ses.user);
    else if(gm)hideLogin();else showLogin();
  }catch(e){if(gm)hideLogin();else showLogin()}
}
async function signOutNow(){
  try{if(sb)await sb.auth.signOut()}catch(e){}
  curUser=null;syncSt={s:"idle",t:0,m:""};lsDel(MODEK);
  go("list");showLogin();
}

function backupObj(){return{app:"quaderno-ricette",v:1,recipes:recipes,groups:groups,shop:shop,dishes:dishes,profile:profile}}
function importBackup(txt){
  var o=JSON.parse(txt),rs=Array.isArray(o)?o:(o&&o.recipes);
  if(!Array.isArray(rs))throw new Error("x");
  var n=0;
  rs.forEach(function(r){
    if(!r||typeof r!=="object"||!r.id)return;
    if(!Array.isArray(r.ingredients))r.ingredients=[];
    var i=recipes.findIndex(function(x){return x.id===r.id});
    if(i<0){recipes.push(r);n++}else if((r.updated||0)>(recipes[i].updated||0)){recipes[i]=r;n++}
  });
  if(o&&Array.isArray(o.groups))o.groups.forEach(function(g){g=String(g||"").trim();if(g&&!groups.some(function(x){return x.toLowerCase()===g.toLowerCase()}))groups.push(g)});
  if(o&&o.shop&&Array.isArray(o.shop.entries)&&!shop.entries.length)shop={entries:o.shop.entries,checked:o.shop.checked||{}};
  if(o&&Array.isArray(o.dishes))o.dishes.forEach(function(d){if(!d||typeof d!=="object"||!d.id)return;var i=dishes.findIndex(function(x){return x.id===d.id});if(i<0){dishes.push(d);n++}else if((d.updated||0)>(dishes[i].updated||0)){dishes[i]=d;n++}});
  if(o&&o.profile&&typeof o.profile==="object"&&!pfHas(profile)&&pfHas(o.profile)){profile=Object.assign(JSON.parse(JSON.stringify(DEFPF)),o.profile);if(!profile.social)profile.social={};if(!profile.dieta)profile.dieta={};lsSet(PFK,profile)}
  saveLocal();persistGroups();persistShop();saveDishes();queuePush(true);
  return n;
}

function autoAl(name){
  var s=" "+nz(name)+" ",out={},ng=/(?:^| )(senza glutine|gluten free)(?= |$)/.test(s);
  for(var i=0;i<ALX.length;i++){var e=ALX[i];for(var j=0;j<e.rx.length;j++){var rx=e.rx[j];if(rx.test(s)){e.nums.forEach(function(n){out[n]=1});s=s.replace(rx," ");break}}}
  if(ng)delete out[1];
  return Object.keys(out).map(Number).sort(function(a,b){return a-b});
}

function readPhoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var S=400,c=document.createElement("canvas");c.width=S;c.height=S;
      var w=img.naturalWidth,h=img.naturalHeight,m=Math.min(w,h);
      c.getContext("2d").drawImage(img,(w-m)/2,(h-m)/2,m,m,0,0,S,S);
      cb(c.toDataURL("image/jpeg",.72));
    };
    img.onerror=function(){flash("Non riesco a leggere la foto.")};
    img.src=fr.result;
  };
  fr.onerror=function(){flash("Non riesco a leggere la foto.")};
  fr.readAsDataURL(file);
}
