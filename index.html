<title>Quaderno di ricette</title>
<style>
:root{--paper:#FDFDFB;--grid:#D9E4F4;--ink:#1C2A4A;--soft:#55627F;--line:#C3CDDF;--accent:#2447B3;--on:#fff;--done:#2F8F5B;--todo:#E0B100;--field:#fff;--card:#fff;--glass:rgba(255,255,255,.4);--glass-hi:rgba(255,255,255,.7);--glass-b:rgba(255,255,255,.8);--glass-s:rgba(28,42,74,.22);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#151D2E;--grid:#202D47;--ink:#E8ECF5;--soft:#9AA7C2;--line:#2C3A57;--accent:#7C9BFF;--on:#0F1624;--done:#4CC38A;--todo:#F2C94C;--field:#0F1624;--card:#1B2538;--glass:rgba(44,58,87,.45);--glass-hi:rgba(255,255,255,.16);--glass-b:rgba(255,255,255,.2);--glass-s:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#151D2E;--grid:#202D47;--ink:#E8ECF5;--soft:#9AA7C2;--line:#2C3A57;--accent:#7C9BFF;--on:#0F1624;--done:#4CC38A;--todo:#F2C94C;--field:#0F1624;--card:#1B2538;--glass:rgba(44,58,87,.45);--glass-hi:rgba(255,255,255,.16);--glass-b:rgba(255,255,255,.2);--glass-s:rgba(0,0,0,.55);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
.grid{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 24px 110px}
.cover h1{font:700 clamp(46px,13vw,76px)/1 Caveat,cursive;margin:0 0 10px}
.cover p{margin:0;color:var(--soft)}
.cover .big{margin-top:26px;padding:15px 40px;font-size:18px;border-radius:99px}
.cover .small{margin-top:14px;font-size:14px}
.view{scrollbar-width:none;position:fixed;inset:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(40px + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.view.on{visibility:visible;transform:none;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.view::-webkit-scrollbar{display:none}
#v-list{z-index:10;transform:translateY(100%)}
#v-recipe{z-index:11;transform:translateX(100%)}
#v-form{z-index:12;transform:translateX(100%)}
#v-shop{z-index:11;transform:translateX(100%)}
#v-list.on,#v-recipe.on,#v-form.on,#v-shop.on{transform:none}
.sheet{max-width:640px;margin:0 auto}
.fbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fbar .back{margin:0}
.fbar .b{padding:11px 20px;border-radius:99px;font-size:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.head h2{font:700 clamp(40px,11vw,56px)/1 Caveat,cursive;margin:0}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--glass-b),0 8px 24px var(--glass-s);color:var(--ink)}
.plus{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;font:inherit}
.back{border-radius:99px;padding:8px 14px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;margin-bottom:10px}
.row{display:block;width:100%;text-align:left;border:0;border-left:8px solid var(--accent);border-radius:4px 14px 14px 4px;background:var(--card);color:var(--ink);padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 0 var(--line);font-family:inherit}
.row.fatta{border-left-color:var(--done)}
.rt{display:block;font:700 26px/1.1 Caveat,cursive;overflow-wrap:anywhere}
.rs{display:block;font-size:14px;color:var(--soft)}
#search{margin-bottom:8px}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chipb{border:1.5px solid var(--line);background:var(--field);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 15px/1 "Source Sans 3",system-ui,sans-serif;cursor:pointer}
.chipb.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.serv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 2px;font-size:18px}
.gh{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);font:700 28px/1.2 Caveat,cursive;padding:10px 2px 4px;margin:14px 0 10px;cursor:pointer;text-align:left}
.gc{font:600 14px "Source Sans 3",system-ui,sans-serif;color:var(--soft)}
.gv{font:600 26px/1 "Source Sans 3",system-ui,sans-serif;color:var(--soft);transition:transform .2s}
.gv.open{transform:rotate(90deg)}
.row,.gh{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grp{border-radius:14px;margin-bottom:6px;padding-bottom:2px}
.grp.over{background:var(--glass-hi);outline:2px dashed var(--accent);outline-offset:3px}
.gemp{color:var(--soft);font-size:15px;margin:2px 2px 12px}
.ghint{color:var(--soft);font-size:14px;margin:2px 0 8px}
.row.drag{opacity:.3}
.row.ghost{position:fixed;z-index:100;pointer-events:none;margin:0;box-shadow:0 10px 28px var(--glass-s);transform:scale(1.03);opacity:.96}
.gbar{display:flex;gap:8px;margin-bottom:10px}
.gnew{display:flex;gap:8px;margin-bottom:12px}
.gnew input{flex:1;min-width:0}
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;border-radius:99px;padding:6px}
.dock button{display:flex;align-items:center;gap:8px;border:0;border-radius:99px;background:transparent;color:var(--ink);font:600 17px/1 "Source Sans 3",system-ui,sans-serif;padding:12px 26px;cursor:pointer}
.dock button[aria-current="true"]{background:var(--glass-hi);box-shadow:inset 0 1px 0 var(--glass-b)}
h2.t{font:700 clamp(36px,10vw,52px)/1.05 Caveat,cursive;margin:0 0 10px;overflow-wrap:anywhere}
h3{font:700 22px/1.2 Caveat,cursive;margin:22px 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.chip{padding:2px 10px;border-radius:99px;border:1.5px solid var(--todo);font-size:14px;font-weight:600}
.chip.fatta{border-color:var(--done)}
button.b{font:600 15px/1 "Source Sans 3",system-ui,sans-serif;padding:10px 13px;border-radius:8px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
button.b.p{background:var(--accent);border-color:var(--accent);color:var(--on)}
button.b.d{color:var(--soft)}
button.b.d.sure{border-color:#C0392B;color:#C0392B}
ul.ingr{list-style:none;margin:0;padding:0}
ul.ingr li{padding:4px 0;border-bottom:1px dashed var(--line)}
ul.ingr b{font-weight:600}
.mk{color:var(--soft);font-size:15px;font-style:italic}
.hbtn{display:flex;gap:8px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.src{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:99px;padding:2px 2px 2px 12px;font-size:14px;background:var(--card)}
.src button{border:0;background:transparent;color:var(--soft);font-size:15px;cursor:pointer;padding:4px 8px}
.sp{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);padding:11px 2px;cursor:pointer;font:inherit}
.bx{flex:none;width:24px;height:24px;border:2px solid var(--soft);border-radius:7px;margin-top:2px}
.sp.on .bx{background:var(--done);border-color:var(--done)}
.sp.on .bx::after{content:"✓";display:block;text-align:center;line-height:20px;font-size:16px;color:#fff}
.sp.on .spn{text-decoration:line-through;color:var(--soft)}
.spt{display:block}
.spn{display:block;font-size:18px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.empty{text-align:center;margin-top:14vh;color:var(--soft)}
label.l{display:block;font-weight:600;margin:16px 0 4px}
input,select,textarea{width:100%;font:16px/1.3 "Source Sans 3",system-ui,sans-serif;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.ing{display:grid;gap:6px;grid-template-columns:72px 1fr 40px;grid-template-areas:"n n n" "m m m" "q u x";margin-bottom:12px}
.ing .iq{grid-area:q}.ing .iu{grid-area:u}.ing .in{grid-area:n}.ing .im{grid-area:m}.ing .rm{grid-area:x;padding:0}
@media (min-width:720px){.ing{grid-template-columns:1fr 1fr 84px 140px 40px;grid-template-areas:"n m q u x";margin-bottom:8px}}
.actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Liquid glass ===== */
:root{--sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;--paper:#EDF0F9;--ink:#15181F;--soft:#667085;--line:rgba(60,72,110,.16);--accent:#0A7AFF;--on:#fff;--field:rgba(255,255,255,.55);--b1:rgba(110,165,255,.6);--b2:rgba(255,160,200,.5);--b3:rgba(165,140,255,.45);--gl:linear-gradient(135deg,rgba(255,255,255,.66),rgba(255,255,255,.3));--gl-b:rgba(255,255,255,.8);--gl-hi:rgba(255,255,255,.95);--gl-s:rgba(40,60,130,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0A0E19;--ink:#F2F4FA;--soft:#9AA3BA;--line:rgba(255,255,255,.14);--accent:#4C9BFF;--field:rgba(255,255,255,.08);--b1:rgba(40,100,255,.42);--b2:rgba(190,70,210,.3);--b3:rgba(20,170,190,.24);--gl:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));--gl-b:rgba(255,255,255,.2);--gl-hi:rgba(255,255,255,.3);--gl-s:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--paper:#0A0E19;--ink:#F2F4FA;--soft:#9AA3BA;--line:rgba(255,255,255,.14);--accent:#4C9BFF;--field:rgba(255,255,255,.08);--b1:rgba(40,100,255,.42);--b2:rgba(190,70,210,.3);--b3:rgba(20,170,190,.24);--gl:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));--gl-b:rgba(255,255,255,.2);--gl-hi:rgba(255,255,255,.3);--gl-s:rgba(0,0,0,.4)}
body{font-family:var(--sf)}
.grid{background-color:var(--paper);background-image:radial-gradient(70% 45% at 12% 6%,var(--b1),transparent 70%),radial-gradient(55% 40% at 95% 30%,var(--b2),transparent 70%),radial-gradient(70% 50% at 25% 100%,var(--b3),transparent 70%);background-size:auto}
.glass,.row,.gh,button.b,.chipb,.src,.sp,ul.ingr,.txt{background:var(--gl);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gl-b);box-shadow:inset 0 1px 1px var(--gl-hi),inset 0 -1px 2px rgba(255,255,255,.12),0 8px 22px var(--gl-s);color:var(--ink)}
.head h2{font:700 34px/1.1 var(--sf);letter-spacing:-.025em}
h2.t{font:700 30px/1.15 var(--sf);letter-spacing:-.02em}
.cover h1{font:700 clamp(36px,10vw,50px)/1.05 var(--sf);letter-spacing:-.03em}
.rt{font:600 18px/1.25 var(--sf)}
.rs{font-size:14px}
h3{font:600 20px/1.2 var(--sf)}
input,select,textarea,button.b,.chipb{font-family:var(--sf)}
.row{border-radius:22px;padding:14px 18px;margin-bottom:10px}
.row,.gh,button.b{transition:transform .15s}
.row:active,.gh:active,button.b:active{transform:scale(.98)}
.gh{border-radius:999px;padding:11px 12px 11px 20px;margin:6px 0 10px;font:600 17px/1.2 var(--sf)}
.gc{display:inline-block;background:var(--line);border-radius:99px;padding:2px 9px;margin-left:6px;font:600 13px/1.4 var(--sf);color:var(--soft)}
.gv{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gl);border:1px solid var(--gl-b);box-shadow:inset 0 1px 1px var(--gl-hi);font:600 22px/1 var(--sf);padding-bottom:3px;color:var(--soft)}
.grp{border-radius:30px}
.grp.over{outline:none;background:rgba(10,122,255,.1);box-shadow:0 0 0 2px var(--accent),0 0 28px rgba(10,122,255,.3)}
button.b{border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px}
button.b.p{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--accent);border:1px solid rgba(255,255,255,.4);color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 8px 20px rgba(10,122,255,.38)}
button.b.d{color:var(--soft)}
button.b.d.sure{color:#E5484D;border-color:rgba(229,72,77,.6);background:rgba(229,72,77,.12)}
.ing .rm{width:40px;height:40px;padding:0;border-radius:50%}
.plus{width:46px;height:46px}
.back{border-radius:999px;padding:9px 16px;font:600 16px/1 var(--sf)}
.chipb.on{background:var(--accent);color:#fff;border-color:transparent}
input,select,textarea{background:var(--field);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--gl-b);border-radius:16px;padding:12px 14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.05);color:var(--ink)}
textarea{border-radius:20px}
#search,#g-new{border-radius:999px;padding:12px 18px}
input::placeholder,textarea::placeholder{color:var(--soft);opacity:.8}
ul.ingr{border-radius:22px;padding:2px 16px}
ul.ingr li{border-bottom:1px solid var(--line);padding:10px 0}
ul.ingr li:last-child{border-bottom:0}
.txt{border-radius:22px;padding:14px 16px}
.sp{border-radius:20px;padding:12px 16px;margin-bottom:8px;gap:14px;width:100%}
.bx{width:26px;height:26px;border-radius:50%;background:var(--field)}
.sp.on .bx::after{line-height:22px}
#toast{background:rgba(24,26,34,.78);color:#fff;border-radius:999px;padding:11px 18px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2)}
/* ===== Gerarchia: ricette in primo piano ===== */
:root{--rc:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,255,255,.74));--tint:rgba(90,100,140,.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rc:linear-gradient(135deg,rgba(255,255,255,.27),rgba(255,255,255,.12));--tint:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--rc:linear-gradient(135deg,rgba(255,255,255,.27),rgba(255,255,255,.12));--tint:rgba(255,255,255,.07)}

  var t=e.touches[0];if(t.clientX>24)return;
  sw={x:t.clientX,y:t.clientY,t0:Date.now(),el:el,dx:0,on:false};
},{passive:true});
document.addEventListener("touchmove",function(e){
  if(!sw)return;
  var t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(!sw.on){
    if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){sw=null;return}
    if(dx>8){sw.on=true;sw.el.style.transition="none";sw.el.style.boxShadow="-10px 0 30px rgba(0,0,0,.2)"}
    else return;
  }
  e.preventDefault();sw.dx=Math.max(0,dx);sw.el.style.transform="translateX("+sw.dx+"px)";
},{passive:false});
function swEnd(){
  if(!sw)return;
  var s=sw;sw=null;if(!s.on)return;
  var w=window.innerWidth,v=s.dx/Math.max(1,Date.now()-s.t0),ok=s.dx>w*0.33||v>0.6;
  s.el.style.transition="transform .22s ease";
  s.el.style.transform="translateX("+(ok?w:0)+"px)";
  setTimeout(function(){
    s.el.style.transition="";s.el.style.transform="";s.el.style.boxShadow="";
    if(ok){suppress=true;setTimeout(function(){suppress=false},350);backFromOverlay()}
  },230);
}
